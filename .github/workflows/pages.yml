# Build the port with Vite and publish it to GitHub Pages on every push to master.
#
# Two things differ from the usual template. The app is not at the repository root - it lives in
# modern/web, so both the install/build steps and the artifact path point there. And the branch
# is master, which is what this repository has.
#
# `npm run build` is `tsc && vite build`, so a type error fails the deploy rather than shipping
# a broken page. The oracle suite is not run here: it drives a real browser against a dev server
# and belongs on a machine with one, not in the deploy path.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modern/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: modern/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
